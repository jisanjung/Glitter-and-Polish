# Publishes a live preview of every PR to GitHub Pages and comments the link on the PR:
#   https://jisanjung.github.io/Glitter-and-Polish/pr-preview/pr-<N>/
# The preview is removed when the PR is closed or merged.
#
# ONE-TIME SETUP (repo admin): Settings → Pages → Build and deployment →
#   Source: "Deploy from a branch", Branch: gh-pages / (root).
# Do NOT add a custom domain/CNAME to gh-pages — production (glitterpolishnails.com)
# is hosted elsewhere and must not be affected.
# Until Pages is enabled the workflow still succeeds, but the link 404s; reviewers can
# download the "dist-<N>" artifact from the CI run instead.
name: PR preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency: preview-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
jobs:
  preview:
    # Forked PRs can't write to this repo; they rely on the CI artifact.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        # Relative base so the site works under /pr-preview/pr-N/.
        # Preview builds never get production secrets; Firebase logging is off there.
        run: npx vite build --base=./
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
